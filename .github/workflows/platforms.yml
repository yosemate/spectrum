name: Windows and Linux runtime
on: [push, pull_request, workflow_dispatch]
jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s run -p "test_*.py" -v
  novnc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: bash run/setup.sh
      - run: bash run/start_display.sh
      - run: DISPLAY=:99 QT_QPA_PLATFORM=xcb .venv/bin/python run/probe_qt.py
      - run: .venv/bin/python run/probe_novnc.py
      - run: DISPLAY=:99 QT_QPA_PLATFORM=xcb .venv/bin/python -m unittest discover -s tests -p test_platform_integration.py -v
